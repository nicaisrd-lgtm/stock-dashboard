    /* iPad / tablet optimised layout */
    .ipad-card-grid{display:none}
    .stock-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
    .stock-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .stock-card-symbol{font-size:26px;font-weight:900;color:var(--blue);letter-spacing:-.02em;cursor:pointer}
    .stock-card-company{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.25}
    .stock-card-price{font-size:28px;font-weight:900;letter-spacing:-.03em;text-align:right}
    .stock-card-theme{justify-self:start}
    .stock-card-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .stock-card-metric{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:66px}
    .stock-card-metric .metric-label{font-size:11px;font-weight:800;text-transform:none}

    .stock-card-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}

    .ipad-hint{display:none;color:var(--muted);font-size:12px;margin:8px 0 0}



    .status-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 16px}
    .status-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}

    .status-card .value{margin-top:5px;font-weight:900;font-size:14px}
    .warning-text{font-size:12px;line-height:1.35;color:var(--amber);margin-top:6px;max-width:240px;white-space:normal}
        .priority-toggle{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px}
    .priority-toggle-label{font-size:11px;color:var(--muted);font-weight:900;margin-right:2px;white-space:nowrap}

    .priority-btn:hover{border-color:var(--blue);color:var(--text)}
    .priority-btn.active{color:#fff;border-color:transparent}

    .priority-btn.speculative.active{background:var(--red)}
    .priority-help{font-size:11px;color:var(--muted);line-height:1.35;margin-top:-4px}
    td .priority-toggle{background:transparent;border:0;padding:0;min-width:212px}
    td .priority-toggle-label{display:none}
    td .priority-btn{padding:6px 9px;min-height:28px}
    .note-box{width:100%;min-height:84px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:10px;font-family:inherit;font-size:13px;resize:vertical}

    .market-clocks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  function getMarketStatus(){

  function hydrateStocks(){
    // Keep user-managed fields such as Priority and Notes from the watchlist.
    // Live API data is stored separately in state.stocks, so we merge both.
    // Order matters: API values can update quote fields, but manual fields stay from watchlist.
    return state.watchlist.map(w=>{
      const api=state.stocks[w.symbol]||{};
      return Object.assign({symbol:w.symbol,theme:w.theme,status:'waiting'}, api, {
        priority:w.priority||api.priority||defaultPriority(w.symbol),

        theme:w.theme||api.theme||'Other'
      });
    });
  }
  function getRiskBucket(s){
    const r=typeof s.entryRisk==='number'?s.entryRisk:null;
    if(r==null) return 'Unknown';
    if(r>=80) return 'Avoid Chasing';
    if(r>=61) return 'Elevated Entry Risk';
    if(r>=31) return 'Moderate Entry Risk';
    return 'Lower Entry Risk';
  }
  function matchesAction(s,action){
    if(action==='All') return true;
    const tag=String(s.actionTag||'');
    if(action==='Watch') return tag.includes('Watch')||tag.includes(t('watchEntry'));
    if(action==='Hold') return tag.includes('Hold')||tag.includes(t('holdWatch'));
    if(action==='Wait for Pullback') return tag.includes('Pullback')||tag.includes(t('waitPullback'));
    if(action==='Avoid Chasing') return tag.includes('Avoid')||tag.includes(t('avoidChasing'));
    if(action==='High Volatility') return (s.stabilityScore||0)<45 || String(s.theme||'').includes('Volatility');
    if(action==='Stable Candidate') return tag.includes('Stable')||tag.includes(t('stableCandidate'));
    if(action==='Momentum Candidate') return (s.trendScore||0)>=70;
    return true;
  }
  function applyQuick(arr){
    if(quickFilter==='All') return arr;
    if(quickFilter==='aiRelated') return arr.filter(s=>String(s.theme||'').startsWith('AI'));
    if(quickFilter==='strongToday') return arr.filter(s=>(s.dp||0)>0);
    if(quickFilter==='lowerRisk') return arr.filter(s=>(s.entryRisk||999)<45);
    if(quickFilter==='waitPullback') return arr.filter(s=>matchesAction(s,'Wait for Pullback'));
    if(quickFilter==='avoidChasing') return arr.filter(s=>matchesAction(s,'Avoid Chasing') || (s.entryRisk||0)>=80);
    return arr;
  }
  function sortValue(s,key){
    if(key==='symbol') return s.symbol;
    if(key==='change') return s.dp;
    if(key==='perf5') return s.perf5;
    if(key==='perf30') return s.perf30;
    if(key==='perf90') return s.perf90;
    if(key==='trend') return s.trendScore;
    if(key==='stability') return s.stabilityScore;
    if(key==='risk') return s.entryRisk;
    if(key==='price') return s.c;
    return null;
  }
  function parseSort(){
    const parts=String(sort||'default').split('_');
    if(sort==='default') return {key:'symbol',dir:'asc',isDefault:true};
    return {key:parts[0]||'symbol',dir:parts[1]||'desc',isDefault:false};
  }
  function sortRows(arr){
    const {key,dir}=parseSort();
    arr.sort((a,b)=>{
      const av=sortValue(a,key), bv=sortValue(b,key);
      if(key==='symbol') return String(av||'').localeCompare(String(bv||''));
      const an=(typeof av==='number'&&isFinite(av))?av:(dir==='asc'?999999:-999999);
      const bn=(typeof bv==='number'&&isFinite(bv))?bv:(dir==='asc'?999999:-999999);
      return dir==='asc'?an-bn:bn-an;
    });
    return arr;
  }
  function filteredStocks(){
    let arr=hydrateStocks();
    if(activeTheme!=='All') arr=arr.filter(s=>s.theme===activeTheme);
    if(activeAction!=='All') arr=arr.filter(s=>matchesAction(s,activeAction));
    if(activeRisk!=='All') arr=arr.filter(s=>getRiskBucket(s)===activeRisk);
    arr=applyQuick(arr);
    if(search.trim()){const q=search.trim().toUpperCase(); arr=arr.filter(s=>s.symbol.includes(q)||String(s.name||'').toUpperCase().includes(q));}
    return sortRows(arr);
  }

  function renderRanking(){
    const stocks=hydrateStocks().filter(s=>s.status==='live');
    const cats=[...new Set(state.watchlist.map(w=>w.theme||'Other'))];
    $('page').innerHTML=`${renderSummaryCards()}<div class="grid" style="margin-top:16px">${cats.map(cat=>{
      const arr=stocks.filter(s=>s.theme===cat); if(!arr.length) return `<div class="card"><h3>${escapeHtml(cat)}</h3><div class="muted">${t('noLiveYet')}</div></div>`;
      const best=[...arr].sort((a,b)=>(b.trendScore||0)-(a.trendScore||0))[0]; const stable=[...arr].sort((a,b)=>(b.stabilityScore||0)-(a.stabilityScore||0))[0]; const risk=[...arr].sort((a,b)=>(b.entryRisk||0)-(a.entryRisk||0))[0];
      return `<div class="card"><h3>${escapeHtml(cat)}</h3><div class="kpi-grid"><div class="kpi"><div class="metric-label">${t('strongTrend')}</div><b class="ticker" data-view="${best.symbol}">${best.symbol}</b><div>${scoreBadge(best.trendScore)}</div></div><div class="kpi"><div class="metric-label">${t('stableCandidate')}</div><b class="ticker" data-view="${stable.symbol}">${stable.symbol}</b><div>${scoreBadge(stable.stabilityScore)}</div></div><div class="kpi"><div class="metric-label">${t('avoidChasing')}</div><b class="ticker" data-view="${risk.symbol}">${risk.symbol}</b><div>${scoreBadge(risk.entryRisk,'risk')}</div></div></div></div>`;
    }).join('')}</div>`;
    bindRowActions();
    updateMarketClocks();
  }
  function renderWeekly(){
    const stocks=hydrateStocks(); const live=stocks.filter(s=>s.status==='live'); const error=stocks.filter(s=>s.status==='error');
    const buckets=[
      [t('bucketCore'),live.filter(s=>(s.trendScore||0)>=65&&(s.stabilityScore||0)>=60&&(s.entryRisk||0)<75)],
      [t('bucketEntry'),live.filter(s=>(s.trendScore||0)>=55&&(s.entryRisk||0)<60)],
      [t('bucketPullback'),live.filter(s=>(s.trendScore||0)>=65&&(s.entryRisk||0)>=65)],
      [t('bucketRisk'),live.filter(s=>(s.stabilityScore||0)<45||(s.entryRisk||0)>=80)],
      [t('bucketError'),error]
    ];
    $('page').innerHTML=`${renderSummaryCards()}<div class="card" style="margin-top:16px"><h2 style="margin-top:0">${t('weekly')}</h2>${buckets.map(([name,arr])=>`<div class="bucket"><div><div class="bucket-title">${name}</div><div class="muted">${arr.length} ${t('ticker')}</div></div><div class="pill-list">${arr.length?arr.map(s=>`<span class="badge ${s.status==='error'?'red':s.entryRisk>=75?'red':s.trendScore>=70?'green':'amber'} ticker" data-view="${s.symbol}">${s.symbol}</span>`).join(''):`<span class="muted">—</span>`}</div></div>`).join('')}</div>`;
    bindRowActions();
    updateMarketClocks();
  }
  function renderSettings(){
    const errors=hydrateStocks().filter(s=>s.status==='error' || s.chartError);
    $('page').innerHTML=`<div class="card"><h2 style="margin-top:0">${t('settings')}</h2><div class="notice warn"><div><b>${t('noMock')}</b><div class="muted">${t('apiEndpoint')}</div></div></div>
      <div class="field"><label>Finnhub API Key · Quote / Price</label><input class="input" id="settingsKey" type="password" value="${escapeHtml(currentKey())}" placeholder="${t('keyPlaceholder')}"></div>
      <div class="field"><label>Twelve Data API Key · Historical Chart / K-line</label><input class="input" id="settingsChartKey" type="password" value="${escapeHtml(currentChartKey())}" placeholder="${t('chartKeyPlaceholder')}"></div>
      <button class="btn primary" id="settingsSave">${t('saveKey')}</button></div><div style="margin-top:16px">${renderStatusStrip()}</div>${errors.length?`<div class="card" style="margin-top:16px"><h3>${t('errors')}</h3><ul class="error-list">${errors.map(e=>`<li><b>${e.symbol}</b>: ${escapeHtml(e.error||e.chartError||'Unknown error')}</li>`).join('')}</ul></div>`:''}`;
    $('settingsSave').onclick=()=>{localStorage.setItem(KEY_STORAGE,$('settingsKey').value.trim());localStorage.setItem(CHART_KEY_STORAGE,$('settingsChartKey').value.trim());$('apiKey').value=$('settingsKey').value.trim(); if($('chartApiKey')) $('chartApiKey').value=$('settingsChartKey').value.trim(); render();};
  }
  function updateStickyTableHeader(){
    const panel=document.querySelector('.filter-panel');
    const wrap=document.querySelector('.desktop-table-wrap');
    if(!panel||!wrap) return;
    const rect=panel.getBoundingClientRect();
    const panelBottom=Math.max(0, Math.ceil(rect.bottom));
    // Table is now its own scroll area. This keeps the visible table height
    // calculated from the bottom of the sticky filter panel. The table header
    // itself stays sticky at top:0 inside the table panel, so it cannot float
    // into the data rows or disappear above the panel.
    document.documentElement.style.setProperty('--stock-table-panel-top', (panelBottom + 24) + 'px');
  }
  function render(){setTopTexts();renderNotice();renderTabs(); if(activePage==='detail')renderDetail(); else if(activePage==='ranking')renderRanking(); else if(activePage==='weekly')renderWeekly(); else if(activePage==='settings')renderSettings(); else renderWatchlist(); requestAnimationFrame(updateStickyTableHeader);}
  window.addEventListener('scroll',updateStickyTableHeader,{passive:true});
  window.addEventListener('resize',updateStickyTableHeader);

  async function refreshLiveData(){
    if(isRefreshing) return;
    const token=currentKey(); if(!token){state.globalError='Finnhub API key required';render();return;}
    isRefreshing=true; state.globalError=null; state.stocks=state.stocks||{};
    state.watchlist.forEach(w=>{state.stocks[w.symbol]=Object.assign({},state.stocks[w.symbol]||{},w,{status:'loading',error:null});});
    render();
    for(const item of state.watchlist){
      try{
        const data=await fetchQuoteStock(item.symbol,token,item.theme,state.stocks[item.symbol]||{});
        state.stocks[item.symbol]=data;
      } catch(err){
        state.stocks[item.symbol]=Object.assign({},state.stocks[item.symbol]||{},item,{status:'error',error:err.message||String(err),updatedAt:new Date().toISOString()});
      }
      saveState(); render();
      await delay(120);
    }
    state.lastRefresh=new Date().toISOString(); isRefreshing=false; saveState(); render();
  }

  async function refreshChartData(symbols){
    if(isRefreshingCharts) return;
    const token=currentKey(); if(!token){state.globalError='Finnhub API key required';render();return;}
    const list=(symbols&&symbols.length?symbols:state.watchlist.map(w=>w.symbol));
    isRefreshingCharts=true; state.globalError=null; state.stocks=state.stocks||{}; render();
    for(const sym of list){
      const item=state.watchlist.find(w=>w.symbol===sym)||{symbol:sym,theme:'Other'};
      const current=state.stocks[sym]||{};
      state.stocks[sym]=Object.assign({},current,item,{chartStatus:'loading',chartError:null});
      saveState(); render();
      try{
        const chart=await fetchChartCandles(sym,token);
        const enriched=enrichWithChart(Object.assign({},state.stocks[sym]||{},item),chart.candles,chart.chartSource,null);
        state.stocks[sym]=enriched;
      } catch(err){
        state.stocks[sym]=Object.assign({},state.stocks[sym]||{},item,{chartStatus:'error',chartSource:'Chart unavailable',chartError:err.message||String(err),chartUpdatedAt:new Date().toISOString(),source:makeSource(state.stocks[sym]||{})});
      }
      saveState(); render();
      await delay(850);
    }
    state.lastChartRefresh=new Date().toISOString(); isRefreshingCharts=false; saveState(); render();
  }

  function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
  async function fetchJson(url,timeoutMs=12000){
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{ const res=await fetch(url,{signal:controller.signal}); if(!res.ok) throw new Error('HTTP '+res.status); const data=await res.json(); return data; }
    finally{clearTimeout(timer)}
  }

  async function fetchQuoteStock(symbol,token,theme,current){
    const quoteUrl=`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(symbol)}&token=${encodeURIComponent(token)}`;
    const profileUrl=`https://finnhub.io/api/v1/stock/profile2?symbol=${encodeURIComponent(symbol)}&token=${encodeURIComponent(token)}`;
    const [q,p]=await Promise.allSettled([fetchJson(quoteUrl),fetchJson(profileUrl)]);
    if(q.status!=='fulfilled') throw new Error('Quote API failed: '+q.reason.message);
    const quote=q.value||{}; if(!quote || typeof quote.c!=='number' || quote.c===0) throw new Error('No live quote returned. Check ticker symbol, API key, or API limit.');
    const base=Object.assign({},current||{}, {symbol,theme,status:'live',name:(p.status==='fulfilled'&&p.value&&p.value.name)||(current&&current.name)||symbol,c:quote.c,d:quote.d,dp:quote.dp,h:quote.h,l:quote.l,o:quote.o,pc:quote.pc,t:quote.t,error:null,updatedAt:new Date().toISOString()});
    // Recalculate entry risk using the latest price while keeping cached chart indicators.
    if(base.candles && base.candles.length>1){
      return enrichWithChart(base,base.candles,base.chartSource||'Cached chart data',base.chartError||null);
    }
    base.source=makeSource(base);
    return base;
  }

  async function fetchChartCandles(symbol,token){
    const finnhubCandleUrl=`https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(symbol)}&resolution=D&from=${unixDaysAgo(260)}&to=${unixNow()}&token=${encodeURIComponent(token)}`;
    let finnhubError='';
    try{
      const fh=await fetchJson(finnhubCandleUrl,15000);
      if(fh && fh.s==='ok' && Array.isArray(fh.c) && fh.c.length>1){
        return {candles:fh.c.map((close,i)=>({t:fh.t[i],c:close,o:fh.o[i],h:fh.h[i],l:fh.l[i],v:fh.v[i]})), chartSource:'Finnhub Candle API'};
      }
      finnhubError='Finnhub candle: '+((fh&&(fh.s||fh.error||fh.message))||'no_data');
    }catch(e){
      finnhubError='Finnhub candle: '+(e.message||String(e));
    }
    const tdKey=currentChartKey();
    if(!tdKey) throw new Error(finnhubError+'. '+t('chartKeyNeeded'));
    try{
      const tdUrl=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=1day&outputsize=260&apikey=${encodeURIComponent(tdKey)}`;
      const td=await fetchJson(tdUrl,15000);
      if(td && td.status==='error') throw new Error(td.message||td.code||'Twelve Data error');
      if(td && Array.isArray(td.values) && td.values.length>1){
        const candles=td.values.slice().reverse().map(v=>({
          t:Math.floor(new Date(v.datetime+'T00:00:00Z').getTime()/1000),
          o:Number(v.open),h:Number(v.high),l:Number(v.low),c:Number(v.close),v:Number(v.volume||0)
        })).filter(x=>isFinite(x.c));
        if(candles.length>1) return {candles,chartSource:'Twelve Data Time Series API'};
      }
      throw new Error('Twelve Data returned no values');
    }catch(e){
      throw new Error(finnhubError+'; Twelve Data: '+(e.message||String(e)));
    }
  }

  function enrichWithChart(base,candles,chartSource,chartError){
    candles=(candles||[]).filter(x=>x&&typeof x.c==='number'&&isFinite(x.c));
    const closes=candles.map(x=>x.c).filter(n=>typeof n==='number'&&isFinite(n));
    const volumes=candles.map(x=>x.v).filter(n=>typeof n==='number'&&isFinite(n));
    const perf5=perf(closes,5), perf30=perf(closes,30), perf90=perf(closes,90);
    const ma20=ma(closes,20), ma50=ma(closes,50), ma200=ma(closes,200), rsi=calcRSI(closes,14);
    const latestVolume=volumes.length?volumes[volumes.length-1]:base.latestVolume||null; const avgVol=avg(volumes.slice(-30));
    const trendScore=calcTrendScore({perf5,perf30,perf90,price:base.c,ma20,ma50,ma200,rsi});
    const stabilityScore=calcStabilityScore({perf5,perf30,perf90,avgVol,latestVolume,range:base.h&&base.l&&base.c?(base.h-base.l)/base.c*100:null});
    const entryRisk=calcEntryRisk({perf5,perf30,price:base.c,ma20,ma50,rsi,dp:base.dp});
    const actionTag=makeActionTag(trendScore,stabilityScore,entryRisk,base.dp);
    const out=Object.assign({},base,{candles,chartSource,chartError,chartStatus:chartError?'error':'live',chartUpdatedAt:new Date().toISOString(),perf5,perf30,perf90,ma20,ma50,ma200,rsi,latestVolume,avgVol,trendScore,stabilityScore,entryRisk,actionTag});
    out.source=makeSource(out);
    return out;
  }

  function makeSource(s){
    const q=s.status==='live'?'Finnhub Quote':'—';
    const c=s.chartStatus==='live'?(s.chartSource||'Chart cached'):s.chartStatus==='loading'?'Chart loading':s.chartStatus==='error'?'Chart error':(s.candles&&s.candles.length?'Chart cached':'Chart not loaded');
    return q+' · '+c;
  }
  function perf(closes,days){ if(!closes.length||closes.length<=days)return null; const last=closes[closes.length-1], prev=closes[closes.length-1-days]; return prev?((last/prev)-1)*100:null; }
  function ma(vals,n){ if(vals.length<n)return null; return avg(vals.slice(-n)); }
  function avg(vals){ const a=vals.filter(v=>typeof v==='number'&&isFinite(v)); return a.length?a.reduce((x,y)=>x+y,0)/a.length:null; }
  function calcRSI(closes,period=14){ if(closes.length<period+1)return null; let gains=0,losses=0; const slice=closes.slice(-period-1); for(let i=1;i<slice.length;i++){const diff=slice[i]-slice[i-1]; if(diff>=0)gains+=diff; else losses-=diff;} if(losses===0)return 100; const rs=(gains/period)/(losses/period); return 100-(100/(1+rs)); }
  function clamp(n){return Math.max(0,Math.min(100,n))}
  function calcTrendScore(x){ let s=50; if(x.perf5!=null)s+=x.perf5*1.2; if(x.perf30!=null)s+=x.perf30*.8; if(x.perf90!=null)s+=x.perf90*.35; if(x.ma20&&x.price>x.ma20)s+=6; if(x.ma50&&x.price>x.ma50)s+=7; if(x.ma200&&x.price>x.ma200)s+=8; if(x.rsi>60)s+=5; if(x.rsi<40)s-=8; return clamp(s); }
  function calcStabilityScore(x){ let s=70; const moves=[Math.abs(x.perf5||0),Math.abs(x.perf30||0),Math.abs(x.perf90||0)]; s-=moves[0]*2.0+moves[1]*.8+moves[2]*.25; if(x.range!=null)s-=x.range*1.5; if(x.latestVolume&&x.avgVol&&x.latestVolume>x.avgVol*2)s-=8; return clamp(s); }
  function calcEntryRisk(x){ let s=35; if(x.perf5>5)s+=12; if(x.perf5>10)s+=14; if(x.perf30>15)s+=12; if(x.perf30>30)s+=15; if(x.rsi>70)s+=16; if(x.rsi>80)s+=16; if(x.ma20&&x.price>x.ma20*1.08)s+=10; if(x.ma50&&x.price>x.ma50*1.15)s+=10; if(Math.abs(x.dp||0)>4)s+=8; return clamp(s); }
  function makeActionTag(trend,stability,risk,dp){
    if(risk>=80)return t('avoidChasing'); if(trend>=70&&risk>=65)return t('waitPullback'); if(stability<40)return t('smallOnly'); if(trend>=65&&stability>=60)return t('holdWatch'); if(trend>=55&&risk<60)return t('watchEntry'); return t('neutral');
  }
  function drawChart(id,candles,chartError){
    const canvas=$(id); if(!canvas)return; const ctx=canvas.getContext('2d'); const rect=canvas.parentElement.getBoundingClientRect(); canvas.width=Math.max(300,rect.width*devicePixelRatio); canvas.height=Math.max(220,rect.height*devicePixelRatio); ctx.scale(devicePixelRatio,devicePixelRatio); const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio; ctx.clearRect(0,0,w,h);
    const style=getComputedStyle(document.documentElement); const line=style.getPropertyValue('--line').trim(), text=style.getPropertyValue('--muted').trim(), blue=style.getPropertyValue('--blue').trim(), green=style.getPropertyValue('--green').trim();
    if(!candles||candles.length<2){ctx.fillStyle=text;ctx.font='14px Arial';ctx.fillText(t('noChart'),20,40); if(chartError){ctx.font='12px Arial'; wrapCanvasText(ctx, chartError, 20, 66, w-40, 18);} return;}
    const data=candles.slice(-120); const closes=data.map(d=>d.c); const min=Math.min(...closes), max=Math.max(...closes); const pad=28; const y=v=>h-pad-((v-min)/(max-min||1))*(h-pad*2); const x=i=>pad+i*(w-pad*2)/(data.length-1);
    ctx.strokeStyle=line;ctx.lineWidth=1; for(let i=0;i<5;i++){const yy=pad+i*(h-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(w-pad,yy);ctx.stroke();}
    ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.beginPath();data.forEach((d,i)=>{const xx=x(i),yy=y(d.c); if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);});ctx.stroke();
    const maSeries=(n)=>data.map((_,i)=>{const upto=candles.slice(0,candles.length-data.length+i+1).map(d=>d.c); return upto.length>=n?avg(upto.slice(-n)):null;});
    function plotMA(n,color){const series=maSeries(n);ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.beginPath();let started=false;series.forEach((v,i)=>{if(v==null)return; const xx=x(i),yy=y(v); if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)}); if(started)ctx.stroke();}
    plotMA(20,green); plotMA(50,'#f59e0b');
    ctx.fillStyle=text;ctx.font='12px Arial';ctx.fillText('Price',pad,16);ctx.fillText('MA20',pad+54,16);ctx.fillText('MA50',pad+108,16);
  }
  function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
    const words=String(text||'').split(/\s+/); let line='';
    for(const word of words){ const test=line?line+' '+word:word; if(ctx.measureText(test).width>maxWidth && line){ctx.fillText(line,x,y); line=word; y+=lineHeight;} else line=test; }
    if(line) ctx.fillText(line,x,y);
  }
  function exportCSV(){
    const rows=[['Ticker','Company','Theme','Status','Price','Change %','5D','1M','3M','Trend Score','Stability Score','Entry Risk','Action Tag','Updated','Error']];
    hydrateStocks().forEach(s=>rows.push([s.symbol,s.name||'',s.theme||'',s.status||'',s.c??'',s.dp??'',s.perf5??'',s.perf30??'',s.perf90??'',s.trendScore??'',s.stabilityScore??'',s.entryRisk??'',s.actionTag||'',s.updatedAt||'',s.error||'']));
    const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='live-stock-dashboard.csv'; a.click(); URL.revokeObjectURL(a.href);
  }
  function openModal(){ $('tickerModal').classList.add('show'); $('newSymbol').focus(); }
  function closeModal(){ $('tickerModal').classList.remove('show'); $('newSymbol').value=''; }
  function addTicker(){ const sym=$('newSymbol').value.trim().toUpperCase().replace(/[^A-Z0-9.]/g,''); const theme=$('newTheme').value; if(!sym)return; if(!state.watchlist.find(w=>w.symbol===sym)) state.watchlist.push({symbol:sym,theme,priority:($('newPriority')?$('newPriority').value:'Watch'),notes:''}); saveState(); closeModal(); render(); }
  function removeTicker(sym){ state.watchlist=state.watchlist.filter(w=>w.symbol!==sym); delete state.stocks[sym]; saveState(); if(activeSymbol===sym){activePage='watchlist';activeSymbol=null;} render(); }

  function startAutoRefresh(){
    stopAutoRefresh();
    if(state.autoRefresh){
      autoRefreshTimer=setInterval(()=>{
        if(currentKey() && !isRefreshing) refreshLiveData();
      },30000);
    }
  }
  function stopAutoRefresh(){
    if(autoRefreshTimer){clearInterval(autoRefreshTimer); autoRefreshTimer=null;}
  }
  function toggleAutoRefresh(){
    state.autoRefresh=!state.autoRefresh;
    saveState();
    startAutoRefresh();
    render();
    if(state.autoRefresh && currentKey() && !isRefreshing) refreshLiveData();
  }

  $('apiKey').value=currentKey(); if($('chartApiKey')) $('chartApiKey').value=currentChartKey(); $('saveKeyBtn').onclick=()=>{localStorage.setItem(KEY_STORAGE,$('apiKey').value.trim()); if($('chartApiKey')) localStorage.setItem(CHART_KEY_STORAGE,$('chartApiKey').value.trim()); render(); if(state.autoRefresh && currentKey() && !isRefreshing) refreshLiveData();}; $('refreshBtn').onclick=refreshLiveData; if($('refreshChartsBtn')) $('refreshChartsBtn').onclick=()=>refreshChartData(); $('autoRefreshBtn').onclick=toggleAutoRefresh; $('langBtn').onclick=()=>{state.lang=state.lang==='en'?'zh':'en';saveState();render();};
  $('closeModal').onclick=closeModal; $('cancelModal').onclick=closeModal; $('addTickerConfirm').onclick=addTicker; $('newSymbol').addEventListener('keydown',e=>{if(e.key==='Enter')addTicker();}); $('tickerModal').addEventListener('click',e=>{if(e.target.id==='tickerModal')closeModal();});
  window.addEventListener('scroll', updateStickyTableHeader, {passive:true});
  window.addEventListener('resize', updateStickyTableHeader);
  startAutoRefresh();
  render();
  setInterval(updateMarketClocks,1000);
  updateMarketClocks();
  requestAnimationFrame(updateStickyTableHeader);
})();
